[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brevita"
version = "0.1.0"
description = "Parametric Insurance on GenLayer — automated payouts for real-world disasters"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/direct", "tests/integration"]
pythonpath = ["."]
